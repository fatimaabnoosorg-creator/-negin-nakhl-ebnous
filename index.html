:root{--ink:#1d1411;--date:#6a3b22;--amber:#b4702a;--palm:#33503a;--paper:#efe4d0;--white:#f7f0e3;--line:#d9ccb4;--muted:#5d5750}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:116px}
body{margin:0;background:var(--white);color:var(--ink);font-family:Sharif,"Noto Sans","Noto Sans Devanagari",Tahoma,sans-serif;font-size:17px;line-height:1.85;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{width:min(1120px,calc(100% - 36px));margin-inline:auto}
h1,h2,h3{font-weight:800;line-height:1.35;margin:0}
p{margin:0}
header{position:sticky;top:0;z-index:10;background:rgba(247,240,227,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:block;line-height:0}.brand img{height:76px;width:auto}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:none;padding:2px 12px;border-radius:99px;cursor:pointer;font-size:14px;line-height:1.8}
.langs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:800}
nav{display:flex;gap:26px;overflow-x:auto;padding-bottom:8px;white-space:nowrap;font-weight:800;font-size:15px}
nav a{color:var(--muted)}nav a:hover{color:var(--amber)}
.btn{display:inline-block;border:0;border-radius:99px;padding:11px 30px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;text-align:center}
.btn.alt{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn:hover{background:var(--date);color:#fff}
.hero{overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;min-height:600px}
.hero h1{font-size:clamp(38px,5.6vw,68px);font-weight:900;margin-bottom:20px}
.hero p{font-size:19px;max-width:30em;color:var(--muted);margin-bottom:30px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.art{position:relative;display:grid;place-items:center;padding-block:30px}
.art img{position:relative;width:min(100%,500px);animation:rise .9s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
section{padding-block:88px}
.head{max-width:640px;margin-bottom:46px}
.head h2{font-size:clamp(28px,3.6vw,42px);margin-bottom:10px}
.head p{color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}}
.pimg{background:none;aspect-ratio:4/3;display:grid;place-items:center;padding:8px;margin-bottom:18px;min-height:0}
.pimg img{width:100%;height:100%;object-fit:contain}
.prod h3{font-size:20px;margin-bottom:4px}
.prod p{color:var(--muted);margin-bottom:10px}
.prod a{font-weight:800;color:var(--amber);border-bottom:2px solid currentColor}
.alt-bg{background:var(--paper)}
.two{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
.two .pimg{aspect-ratio:1;margin:0}
.two h2{font-size:clamp(28px,3.6vw,42px);margin-bottom:16px}
.two>div>p{margin-bottom:20px;max-width:36em}
.pts{list-style:none;margin:0;padding:0;font-weight:800}
.pts li{padding-block:9px;border-top:1px solid var(--line)}
.svc>div{padding-inline:28px;border-inline-start:2px solid var(--amber)}
.svc h3,.step h3{font-size:21px;margin-bottom:6px}
.svc p,.step p{color:var(--muted)}
.step b{display:block;font-size:44px;font-weight:900;color:var(--amber);line-height:1.2}
.contact{color:var(--ink)}
.contact .head p{color:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.info>div{margin-bottom:28px}
.info small{display:block;color:var(--muted);font-size:14px}
.info b{font-size:20px;font-weight:800}
.info .num{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:4px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.chip{font-size:14px;font-weight:800;border-radius:99px;padding:1px 14px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip:hover{background:var(--ink);color:#fff}
.info a.l{border-bottom:1.5px solid var(--amber)}
form{display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:800;font-size:15px}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid #c9b998;border-radius:10px;background:#fbf7ee;color:var(--ink)}
select option{color:#000}
textarea{min-height:96px;resize:vertical}
form .btn{background:var(--amber)}form .btn:hover{background:#d0873a}
form .btn.alt{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
form .btn.alt:hover{background:var(--ink);color:#fff}
footer{background:#120b09;color:#b3a99c;padding-block:22px;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:820px){
 .hero .wrap{grid-template-columns:1fr;min-height:0;padding-block:36px}
 .art{order:-1}.art img{width:min(70%,340px)}
 .grid3,.grid4,.two,.cgrid{grid-template-columns:1fr}
 .grid3{gap:36px}.two{gap:28px}.cgrid{gap:40px}
 section{padding-block:60px}
 .svc>div{padding-block:2px}
}
html[lang=en] body{word-spacing:.22em;letter-spacing:.01em}
html[lang=en] h1,html[lang=en] h2{line-height:1.2}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.art img{animation:none}}
</style>
</head>
